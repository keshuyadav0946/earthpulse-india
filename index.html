<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>EarthPulse India</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#050c13; --panel:#0b1826; --panel2:#0e2033;
  --line:#1d3a4d; --ink:#ecf6f2; --muted:#9db8ad; --teal:#2fe6a7; --teal-dk:#0d3b2c;
  --amber:#ffb454; --danger:#ff7a6b; --ok:#3fe08c;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Mukta","Noto Sans",system-ui,sans-serif; font-size:17px; line-height:1.55;
  min-height:100vh; overflow-x:hidden;
}
#stars{position:fixed; inset:0; z-index:0; pointer-events:none}
.stage{display:none; position:relative; z-index:1; min-height:100vh}
.stage.active{display:flex; flex-direction:column; animation:stageIn .55s ease both}
@keyframes stageIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
h1,h2,h3,.display{font-family:"Baloo 2","Noto Sans","Mukta",sans-serif}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit; font-size:16px}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px}

/* ---------- LANGUAGE BAR (top-right, all stages) ---------- */
.lang-bar{
  position:fixed; top:12px; right:12px; z-index:50;
  display:flex; align-items:center; gap:8px;
  background:rgba(11,24,38,.92); border:1px solid var(--line); border-radius:99px;
  padding:6px 8px 6px 14px; backdrop-filter:blur(6px);
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
html[dir="rtl"] .lang-bar{right:auto; left:12px; padding:6px 14px 6px 8px}
.lang-bar label{font-size:15px; font-weight:700; color:var(--muted); white-space:nowrap}
.lang-bar select{
  background:var(--panel2); color:var(--ink); border:1px solid var(--line);
  border-radius:99px; padding:7px 10px; font-size:16px; font-weight:600; max-width:46vw;
}

/* ---------- STAGE 1 : SPLASH ---------- */
#stage-splash{align-items:center; justify-content:center; text-align:center; padding:64px 18px 48px}
.earth-wrap{position:relative; width:min(62vw,320px); aspect-ratio:1; margin:6px auto 8px}
.earth{
  position:absolute; inset:12%; border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 32% 28%, #a5ecff 0%, #3fa9cf 30%, #1d6f9f 58%, #0a3a5c 82%, #062740 100%);
  box-shadow:0 0 60px rgba(63,169,207,.45), 0 0 140px rgba(47,230,167,.18), inset -18px -14px 44px rgba(0,0,0,.55);
  animation:earthFloat 6s ease-in-out infinite;
}
@keyframes earthFloat{0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}}
.land{position:absolute; inset:-12%; animation:spin 46s linear infinite}
.land i{position:absolute; border-radius:46% 54% 58% 42%/52% 44% 56% 48%; background:#3fae72; opacity:.85; filter:blur(1px)}
.land i:nth-child(1){width:34%; height:24%; left:16%; top:20%}
.land i:nth-child(2){width:26%; height:20%; left:56%; top:14%}
.land i:nth-child(3){width:30%; height:26%; left:38%; top:52%}
.land i:nth-child(4){width:18%; height:14%; left:70%; top:58%}
.land i:nth-child(5){width:14%; height:11%; left:8%; top:62%}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:absolute; inset:0; border-radius:50%; border:2px solid rgba(47,230,167,.55); animation:ringPulse 3.2s ease-out infinite}
.ring.r2{animation-delay:1.05s; border-color:rgba(63,185,216,.5)}
.ring.r3{animation-delay:2.1s; border-color:rgba(255,180,84,.45)}
@keyframes ringPulse{0%{transform:scale(.72); opacity:0} 25%{opacity:.9} 100%{transform:scale(1.22); opacity:0}}
.ekg{width:min(88vw,560px); height:74px; margin:2px auto 0}
.ekg .base{stroke:#123c33; stroke-width:3; fill:none}
.ekg .beat{stroke:var(--teal); stroke-width:3.5; fill:none; stroke-linecap:round; stroke-linejoin:round;
  filter:drop-shadow(0 0 7px rgba(47,230,167,.85));
  stroke-dasharray:100; stroke-dashoffset:100; animation:beat 3s linear infinite}
@keyframes beat{0%{stroke-dashoffset:100} 55%{stroke-dashoffset:-100} 100%{stroke-dashoffset:-100}}
.splash-title{margin:10px 0 0; line-height:.98; letter-spacing:.01em}
.splash-title .l1{display:block; font-size:clamp(44px,11vw,96px); font-weight:800; color:var(--ink)}
.splash-title .l1 span{display:inline-block; opacity:0; animation:letterIn .6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes letterIn{from{opacity:0; transform:translateY(26px) scale(.7)} to{opacity:1; transform:none}}
.splash-title .l2{display:block; font-size:clamp(30px,7.5vw,62px); font-weight:800; letter-spacing:.34em; margin-top:2px; color:var(--amber)}
html[dir="rtl"] .splash-title .l2{letter-spacing:.1em}
.tribar{display:flex; width:min(300px,64vw); height:7px; border-radius:99px; overflow:hidden; margin:16px auto 0}
.tribar i{flex:1}.tribar i:nth-child(1){background:#ff9933}.tribar i:nth-child(2){background:#f4f4f4}.tribar i:nth-child(3){background:#2fae4e}
.tagline{font-size:clamp(18px,4.4vw,23px); color:var(--ink); margin:18px auto 4px; max-width:620px; font-weight:600}
.subline{color:var(--muted); font-size:16.5px; margin:0 auto; max-width:640px}
.btn-enter{
  margin-top:34px; border:none; border-radius:99px; padding:17px 58px;
  font-family:"Baloo 2","Noto Sans",sans-serif; font-size:24px; font-weight:800; letter-spacing:.06em;
  color:#04160f; background:var(--teal);
  box-shadow:0 0 0 0 rgba(47,230,167,.55); animation:btnPulse 2s ease-out infinite;
  transition:transform .15s ease;
}
.btn-enter:hover{transform:scale(1.05)}
@keyframes btnPulse{0%{box-shadow:0 0 0 0 rgba(47,230,167,.5)} 100%{box-shadow:0 0 0 26px rgba(47,230,167,0)}}
.splash-note{margin-top:20px; color:var(--muted); font-size:15.5px; max-width:560px}

/* ---------- STAGE 2 : AUTH ---------- */
#stage-auth{align-items:center; justify-content:center; padding:64px 16px 46px}
.auth-card{
  width:min(480px,100%); background:var(--panel); border:1px solid var(--line);
  border-radius:22px; padding:28px 26px 24px;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.auth-head{text-align:center; margin-bottom:6px}
.auth-head .mini-earth{font-size:40px; line-height:1}
.auth-head h2{margin:6px 0 2px; font-size:29px}
.auth-head p{margin:0; color:var(--muted); font-size:16px}
.tabs{display:flex; gap:8px; margin:20px 0 18px}
.tabs button{
  flex:1; border:1px solid var(--line); background:var(--panel2); color:var(--muted);
  border-radius:12px; padding:11px 4px; font-size:16px; font-weight:700;
}
.tabs button.on{background:var(--teal); color:#04160f; border-color:var(--teal)}
.field{margin-bottom:14px}
.field label{display:block; font-weight:600; font-size:16px; margin-bottom:5px}
.field input,.field select{
  width:100%; background:#081220; border:1px solid var(--line); color:var(--ink);
  border-radius:12px; padding:12px 14px;
}
.field input::placeholder{color:#5f7a70}
.field .hint{font-size:14.5px; color:var(--muted); margin-top:4px}
.btn-main{
  width:100%; border:none; border-radius:12px; padding:14px; margin-top:4px;
  background:var(--teal); color:#04160f; font-family:"Baloo 2","Noto Sans",sans-serif;
  font-size:20px; font-weight:800;
}
.btn-main:hover{filter:brightness(1.08)}
.msg{border-radius:12px; padding:11px 14px; font-size:16px; margin:0 0 14px; display:none}
.msg.err{display:block; background:#3a1611; border:1px solid #7a2d20; color:#ffc9c0}
.storage-warn{
  display:none; border-radius:12px; padding:12px 14px; font-size:16px; font-weight:600;
  margin:0 0 16px; background:#3a2a08; border:1px solid #a97b1d; color:#ffe1a1;
}
.storage-warn.show{display:block}
.msg.ok{display:block; background:#0d3325; border:1px solid #1d6b47; color:#b9f4d6}
.linklike{background:none; border:none; color:var(--teal); font-size:16px; font-weight:700; padding:4px 0; text-decoration:underline}
.auth-note{
  margin-top:18px; padding:11px 14px; border-radius:12px; font-size:15px; color:var(--muted);
  background:#081220; border:1px dashed var(--line);
}
.pane{display:none}.pane.on{display:block; animation:stageIn .35s ease both}
.qbox{background:#081220; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-weight:600; margin-bottom:14px}

/* ---------- STAGE 3 : DASHBOARD ---------- */
#stage-dash{padding:0 0 56px}
.dash-inner{width:min(1180px,100%); margin:0 auto; padding:64px 18px 0}
.dash-head{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.avatar{
  width:60px; height:60px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--teal-dk); border:2px solid var(--teal); color:var(--teal);
  font-family:"Baloo 2","Noto Sans",sans-serif; font-size:27px; font-weight:800;
}
.dash-head h2{margin:0; font-size:clamp(27px,5.4vw,38px); line-height:1.1}
.dash-head .who{color:var(--muted); font-size:16.5px; margin:2px 0 0}
.btn-logout{
  margin-inline-start:auto; border:1px solid var(--line); background:var(--panel2); color:var(--ink);
  border-radius:99px; padding:11px 22px; font-size:16.5px; font-weight:700;
}
.btn-logout:hover{border-color:var(--danger); color:var(--danger)}
.dash-intro{color:var(--muted); font-size:17.5px; max-width:760px; margin:16px 0 4px}
.dash-intro b{color:var(--ink)}
.grid{display:grid; grid-template-columns:1fr; gap:20px; margin-top:18px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1080px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{
  display:block; text-decoration:none; color:var(--ink);
  background:var(--panel); border:1px solid var(--line); border-top:5px solid var(--acc);
  border-radius:var(--radius); padding:22px 22px 10px; position:relative;
  transition:transform .18s ease, border-color .18s ease;
}
.card:hover{transform:translateY(-4px); border-color:var(--acc)}
.card .big{font-size:52px; line-height:1}
.card h3{margin:10px 0 4px; font-size:27px}
.card .desc{color:var(--muted); font-size:16.5px; margin:0; min-height:52px}
.card .open-line{margin-top:10px; font-weight:700; color:var(--acc); font-size:16.5px}
.bot-zone{margin-top:8px; border-top:1px dashed var(--line); padding-top:6px}
.bot-track{position:relative; height:86px}
.bot{
  position:absolute; bottom:2px; left:6px; width:52px; text-align:center;
  animation:walk 8s ease-in-out infinite alternate;
}
@keyframes walk{from{left:6px} to{left:calc(100% - 58px)}}
.bot-body{
  width:48px; height:48px; margin:0 auto; border-radius:50%; display:grid; place-items:center;
  font-size:25px; background:var(--panel2); border:2px solid var(--acc);
  animation:bob .5s ease-in-out infinite alternate;
}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)} to{transform:translateY(-5px) rotate(4deg)}}
.bot-name{font-size:14.5px; font-weight:700; color:var(--acc); margin-top:2px}
.bubble{
  position:absolute; top:0; max-width:78%; background:#eefaf4; color:#0a2436;
  border-radius:14px; padding:7px 12px; font-size:15px; font-weight:600; line-height:1.35;
  opacity:0; transform:translateY(4px); transition:opacity .4s ease, transform .4s ease;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.bubble.show{opacity:1; transform:none}
.bubble::after{content:""; position:absolute; bottom:-7px; left:26px; border:8px solid transparent; border-top-color:#eefaf4; border-bottom:0}
html[dir="rtl"] .bubble::after{left:auto; right:26px}
.dash-foot{margin-top:30px; color:var(--muted); font-size:15.5px; text-align:center}
@media (prefers-reduced-motion: reduce){
  .land,.ring,.ekg .beat,.btn-enter,.earth,.bot,.bot-body{animation:none !important}
  .ekg .beat{stroke-dashoffset:0}
  .splash-title .l1 span{opacity:1; animation:none}
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<!-- LANGUAGE SELECTOR — top-right on every stage -->
<div class="lang-bar">
  <label for="lang-select" id="lang-label">🌐 Language</label>
  <select id="lang-select" aria-label="Language">
    <option value="en">English</option>
    <option value="hi">हिन्दी (Hindi)</option>
    <option value="bn">বাংলা (Bengali)</option>
    <option value="te">తెలుగు (Telugu)</option>
    <option value="mr">मराठी (Marathi)</option>
    <option value="ta">தமிழ் (Tamil)</option>
    <option value="ur">اردو (Urdu)</option>
    <option value="gu">ગુજરાતી (Gujarati)</option>
    <option value="kn">ಕನ್ನಡ (Kannada)</option>
    <option value="ml">മലയാളം (Malayalam)</option>
    <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
    <option value="or">ଓଡ଼ିଆ (Odia)</option>
    <option value="as">অসমীয়া (Assamese)</option>
  </select>
</div>

<!-- ================= STAGE 1 : SPLASH ================= -->
<section class="stage active" id="stage-splash" aria-label="Welcome">
  <div class="earth-wrap" aria-hidden="true">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="earth"><div class="land"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
  <svg class="ekg" viewBox="0 0 600 100" preserveAspectRatio="none" aria-hidden="true">
    <path class="base" d="M0,52 L150,52 L166,52 L178,18 L194,86 L206,52 L300,52 L312,38 L322,52 L440,52 L452,52 L464,14 L482,90 L494,52 L600,52"/>
    <path class="beat" pathLength="100" d="M0,52 L150,52 L166,52 L178,18 L194,86 L206,52 L300,52 L312,38 L322,52 L440,52 L452,52 L464,14 L482,90 L494,52 L600,52"/>
  </svg>
  <h1 class="splash-title">
    <span class="l1" id="title-l1">EARTHPULSE</span>
    <span class="l2">INDIA</span>
  </h1>
  <div class="tribar" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="tagline" id="txt-tagline"></p>
  <p class="subline" id="txt-subline"></p>
  <button class="btn-enter" id="btn-enter" type="button"></button>
  <p class="splash-note" id="txt-splash-note"></p>
</section>

<!-- ================= STAGE 2 : AUTH ================= -->
<section class="stage" id="stage-auth" aria-label="Login">
  <div class="auth-card">
    <div class="auth-head">
      <div class="mini-earth" aria-hidden="true">🌍💓</div>
      <h2>EarthPulse India</h2>
      <p id="txt-auth-sub"></p>
    </div>
    <div class="storage-warn" id="storage-warn" role="alert"></div>
    <div class="tabs" role="tablist">
      <button type="button" id="tab-login" class="on"></button>
      <button type="button" id="tab-signup"></button>
      <button type="button" id="tab-forgot"></button>
    </div>

    <!-- LOGIN -->
    <form class="pane on" id="pane-login" autocomplete="off">
      <p class="msg" id="login-msg"></p>
      <div class="field">
        <label for="li-user" id="lbl-li-user"></label>
        <input id="li-user" type="text" placeholder="e.g. keshav_01" required />
      </div>
      <div class="field">
        <label for="li-pass" id="lbl-li-pass"></label>
        <input id="li-pass" type="password" required />
      </div>
      <button class="btn-main" type="submit" id="btn-login"></button>
      <p style="margin:12px 0 0; font-size:16px"><span id="txt-forgot-q"></span> <button type="button" class="linklike" id="goto-forgot"></button></p>
      <p style="margin:2px 0 0; font-size:16px"><span id="txt-new-q"></span> <button type="button" class="linklike" id="goto-signup"></button></p>
    </form>

    <!-- SIGN UP -->
    <form class="pane" id="pane-signup" autocomplete="off">
      <p class="msg" id="signup-msg"></p>
      <div class="field">
        <label for="su-name" id="lbl-su-name"></label>
        <input id="su-name" type="text" placeholder="e.g. Keshav Yadav" required />
      </div>
      <div class="field">
        <label for="su-user" id="lbl-su-user"></label>
        <input id="su-user" type="text" placeholder="e.g. keshav_01" required />
        <div class="hint" id="txt-su-hint"></div>
      </div>
      <div class="field">
        <label for="su-pass" id="lbl-su-pass"></label>
        <input id="su-pass" type="password" required />
      </div>
      <div class="field">
        <label for="su-pass2" id="lbl-su-pass2"></label>
        <input id="su-pass2" type="password" required />
      </div>
      <div class="field">
        <label for="su-q" id="lbl-su-q"></label>
        <select id="su-q"></select>
      </div>
      <div class="field">
        <label for="su-a" id="lbl-su-a"></label>
        <input id="su-a" type="text" required />
      </div>
      <button class="btn-main" type="submit" id="btn-signup"></button>
    </form>

    <!-- FORGOT PASSWORD -->
    <form class="pane" id="pane-forgot" autocomplete="off">
      <p class="msg" id="forgot-msg"></p>
      <div id="fg-step1">
        <div class="field">
          <label for="fg-user" id="lbl-fg-user"></label>
          <input id="fg-user" type="text" placeholder="e.g. keshav_01" />
        </div>
        <button class="btn-main" type="button" id="fg-next1"></button>
      </div>
      <div id="fg-step2" hidden>
        <p style="margin:0 0 6px; font-size:16px" id="txt-fg-intro"></p>
        <div class="qbox" id="fg-question"></div>
        <div class="field">
          <label for="fg-answer" id="lbl-fg-answer"></label>
          <input id="fg-answer" type="text" />
        </div>
        <button class="btn-main" type="button" id="fg-next2"></button>
      </div>
      <div id="fg-step3" hidden>
        <div class="field">
          <label for="fg-newpass" id="lbl-fg-newpass"></label>
          <input id="fg-newpass" type="password" />
        </div>
        <div class="field">
          <label for="fg-newpass2" id="lbl-fg-newpass2"></label>
          <input id="fg-newpass2" type="password" />
        </div>
        <button class="btn-main" type="button" id="fg-save"></button>
      </div>
    </form>

    <div class="auth-note" id="txt-auth-note"></div>
  </div>
</section>

<!-- ================= STAGE 3 : DASHBOARD ================= -->
<section class="stage" id="stage-dash" aria-label="Dashboard">
  <div class="dash-inner">
    <div class="dash-head">
      <div class="avatar" id="dash-avatar">?</div>
      <div>
        <h2 id="dash-welcome">Welcome! 👋</h2>
        <p class="who" id="dash-who"></p>
      </div>
      <button class="btn-logout" id="btn-logout" type="button"></button>
    </div>
    <p class="dash-intro" id="txt-dash-intro"></p>
    <div class="grid" id="site-grid"></div>
    <p class="dash-foot" id="txt-dash-foot"></p>
  </div>
</section>

<script>
/* ============================================================
   CONFIG — links of the five disaster websites (unchanged).
   ============================================================ */
var SITE_LINKS = {
  fire:     "https://keshuyadav0946.github.io/earthpulse-india/fire/",
  flood:    "https://keshuyadav0946.github.io/earthpulse-india/flood/",
  landslide:"https://keshuyadav0946.github.io/earthpulse-india/landslide/",
  coldwave: "https://keshuyadav0946.github.io/earthpulse-india/coldwave/",
  cyclone:  "https://keshuyadav0946.github.io/earthpulse-india/cyclone/"
};

/* Security questions — canonical English values (stored with the account) */
var SECQ_EN = [
  "What was the name of your first school?",
  "What is your pet's name?",
  "In which city were you born?",
  "What is your favourite food?",
  "What is your best friend's name?"
];

/* ============================================================
   TRANSLATIONS — default: English. {name} / {user} are filled in.

desc_fire:"NASA ഉപഗ്രഹങ്ങളിൽ നിന്ന് ഇന്ത്യയിലെ തത്സമയ അഗ്നി സ്ഥിതി, 110 പ്രധാന അഗ്നി രേഖകൾ, പ്രദേശ അഗ്നി-പരിശോധന.",desc_flood:"നദീജലനിരപ്പ്, 44 സ്ഥിരീകരിച്ച വെള്ളപ്പൊക്ക രേഖകൾ, സുരക്ഷാ മാർഗനിർദേശം — ജലിനൊപ്പം.",desc_landslide:"മലയോര പ്രദേശങ്ങളിലെ മണ്ണിടിച്ചിൽ അപകടം, 47 രേഖകൾ, GSI അപകട മേഖലകൾ — ഭൂമിയോടൊപ്പം.",desc_coldwave:"34 കഠിന ശൈത്യ തരംഗങ്ങളുടെ രേഖകൾ, IMD വിവരങ്ങൾ, തണുപ്പിൽ നിന്നുള്ള സംരക്ഷണം — ഹിമ്മിനൊപ്പം.",desc_cyclone:"40 ചുഴലിക്കാറ്റ് രേഖകൾ, പാതാ ഭൂപടങ്ങൾ, തീരത്ത് എത്തുന്ന കഥകൾ — വായുവിനൊപ്പം.",
bot_fire:["ഞാൻ അഗ്നി! തീയുടെ വാർത്ത ആദ്യം എന്റെയടുത്ത് 🔥","പെട്ടിയിൽ അമർത്തുക — അഗ്നി വെബ്‌സൈറ്റ് തുറക്കും!"],bot_flood:["ഞാൻ ജൽ! വെള്ളപ്പൊക്ക ജലം എപ്പോഴും എന്റെ ശ്രദ്ധയിൽ 🌊","ഇവിടെ അമർത്തുക — വെള്ളപ്പൊക്ക വെബ്‌സൈറ്റ് എല്ലാം പറയും!"],bot_landslide:["ഞാൻ ഭൂമി! മല ഇടിയുന്നത് ആദ്യം ഞാൻ അറിയും ⛰️","ഇവിടെ അമർത്തുക — മണ്ണിടിച്ചിൽ വെബ്‌സൈറ്റ് തുറക്കും!"],bot_coldwave:["ഞാൻ ഹിം! തണുപ്പ് വന്നാൽ തയ്യാറെടുപ്പ് എന്റെ ഉത്തരവാദിത്തം ❄️","ഇവിടെ അമർത്തുക — ശൈത്യ തരംഗ വെബ്‌സൈറ്റ് തുറക്കും!"],bot_cyclone:["ഞാൻ വായു! കൊടുങ്കാറ്റ് വന്നാൽ ആദ്യം ഞാൻ സംസാരിക്കും 🌀","ഇവിടെ അമർത്തുക — ചുഴലിക്കാറ്റ് വെബ്‌സൈറ്റ് തുറക്കും!"],
e_name:"നിങ്ങളുടെ പേര് വളരെ ചെറുതായി തോന്നുന്നു — മുഴുവൻ പേര് എഴുതുക (കുറഞ്ഞത് 3 അക്ഷരങ്ങൾ) 🙏",e_user:"3–20 അക്ഷരങ്ങളുള്ള ഉപയോക്തൃനാമം തിരഞ്ഞെടുക്കുക, അക്ഷരങ്ങൾ, അക്കങ്ങൾ അല്ലെങ്കിൽ _ മാത്രം — ഉദാ. keshav_01 👍",e_pass6:"പാസ്‌വേഡ് കുറഞ്ഞത് 6 അക്ഷരങ്ങളാക്കുക — ശക്തമായി സൂക്ഷിക്കുക 🔒",e_passmatch:"രണ്ട് പാസ്‌വേഡുകളും പൊരുത്തപ്പെടുന്നില്ല — പരിശോധിച്ച് വീണ്ടും നൽകുക 👀",e_secans:"സുരക്ഷാ ഉത്തരവും എഴുതുക — പാസ്‌വേഡ് മറന്നാൽ അതാണ് ഏക വഴി.",e_taken:"ഈ ഉപയോക്തൃനാമം ഇതിനകം എടുത്തിട്ടുണ്ട് 😅 — വേറൊന്ന് തിരഞ്ഞെടുക്കുക.",e_noaccount:"ഈ പേരിൽ അക്കൗണ്ട് കണ്ടെത്തിയില്ല 🤔 — അക്ഷരവിന്യാസം പരിശോധിക്കുക, അല്ലെങ്കിൽ ആദ്യം സൈൻ അപ്പിൽ നിന്ന് അക്കൗണ്ട് ഉണ്ടാക്കുക.",e_wrongpass:"തെറ്റായ പാസ്‌വേഡ് 😅 — വീണ്ടും ശ്രമിക്കുക. മറന്നെങ്കിൽ മുകളിലെ 'മറന്നോ?' ടാബ് അമർത്തുക.",e_found:"അക്കൗണ്ട് കണ്ടെത്തി! ഇനി നിങ്ങളുടെ സുരക്ഷാ ചോദ്യത്തിന് ഉത്തരം നൽകുക 👇",e_wrongans:"ആ ഉത്തരം പൊരുത്തപ്പെടുന്നില്ല 😅 — അക്കൗണ്ട് ഉണ്ടാക്കുമ്പോൾ നൽകിയ ഉത്തരം തന്നെ അതേ അക്ഷരവിന്യാസത്തിൽ എഴുതുക.",e_correct:"ശരിയായ ഉത്തരം! 🎉 ഇനി പുതിയ പാസ്‌വേഡ് ഉണ്ടാക്കുക.",e_newpass6:"പുതിയ പാസ്‌വേഡ് കുറഞ്ഞത് 6 അക്ഷരങ്ങളാക്കുക 🔒",e_newmatch:"രണ്ട് പുതിയ പാസ്‌വേഡുകളും പൊരുത്തപ്പെടുന്നില്ല — വീണ്ടും നൽകുക 👀",e_nostore:"⚠ നിങ്ങളുടെ അക്കൗണ്ട് ഈ ബ്രൗസറിൽ സേവ് ചെയ്യാൻ കഴിഞ്ഞില്ല — ഈ പേജ് അടച്ചാൽ അത് അപ്രത്യക്ഷമാകും. ദയവായി ഈ വെബ്‌സൈറ്റ് നേരിട്ട് Chrome അല്ലെങ്കിൽ Safari-യിൽ തുറക്കുക (മറ്റൊരു ആപ്പിനുള്ളിൽ അല്ല, പ്രൈവറ്റ്/incognito മോഡിലും അല്ല), എന്നിട്ട് വീണ്ടും ശ്രമിക്കുക.",storageWarn:"⚠ ഈ ബ്രൗസർ കാഴ്ചയ്ക്ക് അക്കൗണ്ടുകൾ സേവ് ചെയ്യാൻ കഴിയില്ല (പ്രൈവറ്റ് മോഡ് അല്ലെങ്കിൽ ഒരു ആപ്പിനുള്ളിലെ ബ്രൗസർ). ഇവിടെ ഉണ്ടാക്കുന്ന അക്കൗണ്ടുകൾ അടച്ചാൽ അപ്രത്യക്ഷമാകും — ദയവായി ഈ സൈറ്റ് നേരിട്ട് Chrome അല്ലെങ്കിൽ Safari-യിൽ തുറക്കുക."},

/* ---------- storage (localStorage, in-memory fallback) ---------- */
var memStore = {};

  get: function(k){ try { return window.localStorage.getItem(k); } catch(e){ return (k in memStore) ? memStore[k] : null; } },
  set: function(k,v){ try { window.localStorage.setItem(k,v); } catch(e){ memStore[k]=v; } },
  del: function(k){ try { window.localStorage.removeItem(k); } catch(e){ delete memStore[k]; } }
};
var USERS_KEY = "earthpulse_users_v1";
var USERS_BACKUP_KEY = "earthpulse_users_backup";
var SESSION_KEY = "earthpulse_session_v1";

/* ---------- persistence probe: can this browser view really save? ----------
   Some views (private/incognito mode, in-app browsers) accept localStorage
   writes that vanish when the page closes, or throw on access. Probe once
   at startup: write a test key, read it back, remove it. */
var storagePersistent = (function(){
  try {
    var probeKey = "earthpulse_probe_v1";
    window.localStorage.setItem(probeKey, "1");
    var ok = (window.localStorage.getItem(probeKey) === "1");
    window.localStorage.removeItem(probeKey);
    return ok;
  } catch(e){ return false; }
})();
/* Load the accounts store. If the stored JSON cannot be parsed, preserve the
   raw value under a backup key first (only if no backup exists yet) instead
   of silently discarding it, then start from an empty store. */
function loadUsers(){
  var raw = store.get(USERS_KEY);
  if (!raw) return {};
  try {
    var parsed = JSON.parse(raw);
    return (parsed && typeof parsed === "object") ? parsed : {};
  } catch(e){
    try {
      if (!window.localStorage.getItem(USERS_BACKUP_KEY)) window.localStorage.setItem(USERS_BACKUP_KEY, raw);
    } catch(e2){}
    return {};
  }
}
/* Save the accounts store and VERIFY the write: setItem, read back, string-
   compare. Returns true only when the value really landed in localStorage —
   never trust a silent in-memory fallback for accounts. */
function saveUsersVerified(u){
  var payload = JSON.stringify(u);
  try {
    window.localStorage.setItem(USERS_KEY, payload);
    return window.localStorage.getItem(USERS_KEY) === payload;
  } catch(e){ return false; }
}

      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  var hex = "";
  for (t = 0; t < 8; t++) hex += ("0000000" + H[t].toString(16)).slice(-8);
  return hex;
}
function sha256Hex(str){
  if (window.crypto && crypto.subtle && crypto.subtle.digest){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(buf){
      var bytes = new Uint8Array(buf), hex = "";
      for (var i=0;i<bytes.length;i++) hex += ("0"+bytes[i].toString(16)).slice(-2);
      return hex;
    });
  }
  return Promise.resolve(sha256HexSync(str));
}
/* LEGACY hash — the OLD weak 16-char FNV-style fallback. Kept ONLY so accounts
   created with it can still log in; on a legacy match the stored hash is
   silently upgraded to the primary SHA-256. Never used for new hashes. */
function legacyHashWithSalt(secret, salt){
  var str = salt + "::" + secret;
  var h1 = 0x811c9dc5, h2 = 0x01000193;
  for (var j=0;j<str.length;j++){ h1 = Math.imul(h1 ^ str.charCodeAt(j), 0x01000193); h2 = Math.imul(h2 + str.charCodeAt(j), 0x85ebca6b); }
  return ("0000000"+(h1>>>0).toString(16)).slice(-8) + ("0000000"+(h2>>>0).toString(16)).slice(-8);
}
function hashWithSalt(secret, salt){ return sha256Hex(salt + "::" + secret); }
/* Verify a secret against a stored hash: primary SHA-256 first, then the
   legacy hash. Resolves "primary", "legacy" or null. */
function hashMatches(secret, salt, stored){
  return hashWithSalt(secret, salt).then(function(h){
    if (h === stored) return "primary";
    if (legacyHashWithSalt(secret, salt) === stored) return "legacy";
    return null;
  });
}
function normAnswer(a){ return (a || "").trim().toLowerCase().replace(/\s+/g," "); }
function normUser(u){ return (u || "").trim().toLowerCase(); }

/* ---------- splash title letters ---------- */
(function(){
  var l1 = $("title-l1"), text = l1.textContent, out = "";
  for (var i=0;i<text.length;i++) out += '<span style="animation-delay:' + (i*0.07) + 's">' + text.charAt(i) + '</span>';
  l1.innerHTML = out;
})();

/* ---------- starfield / particles ---------- */
(function(){
  var cv = $("stars"), ctx = cv.getContext("2d"), W, H, dots = [], raf = null;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function resize(){
    W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
    dots = [];
    var n = Math.min(110, Math.floor(W*H/16000));
    for (var i=0;i<n;i++) dots.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.7+0.4, s:Math.random()*0.25+0.05, tw:Math.random()*Math.PI*2 });
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    for (var i=0;i<dots.length;i++){
      var d = dots[i]; d.y -= d.s; d.tw += 0.02;
      if (d.y < -4){ d.y = H+4; d.x = Math.random()*W; }
      ctx.globalAlpha = 0.35 + 0.45*Math.abs(Math.sin(d.tw));
      ctx.fillStyle = "#bfe9dc";
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }
  resize();
  window.addEventListener("resize", resize);
  if (!reduced) frame(); else {
    for (var i=0;i<dots.length;i++){ ctx.fillStyle="#bfe9dc"; ctx.beginPath(); ctx.arc(dots[i].x, dots[i].y, dots[i].r, 0, Math.PI*2); ctx.fill(); }
  }
})();

/* ---------- stage flow ---------- */
$("btn-enter").addEventListener("click", function(){ showStage("stage-auth"); });

/* ---------- auth tabs ---------- */
var forgotUser = null;
function showPane(name){
  var panes = { login:$("pane-login"), signup:$("pane-signup"), forgot:$("pane-forgot") };
  var tabs = { login:$("tab-login"), signup:$("tab-signup"), forgot:$("tab-forgot") };
  for (var k in panes){ panes[k].classList.toggle("on", k===name); tabs[k].classList.toggle("on", k===name); }
  if (name === "forgot") resetForgot();
}
$("tab-login").addEventListener("click", function(){ showPane("login"); });
$("tab-signup").addEventListener("click", function(){ showPane("signup"); });
$("tab-forgot").addEventListener("click", function(){ showPane("forgot"); });
$("goto-forgot").addEventListener("click", function(){ showPane("forgot"); });
$("goto-signup").addEventListener("click", function(){ showPane("signup"); });

/* ---------- SIGN UP ---------- */
$("pane-signup").addEventListener("submit", function(ev){
  ev.preventDefault();
  var msg = $("signup-msg"); clearMsg(msg);
  var name = $("su-name").value.trim();
  var user = $("su-user").value.trim();
  var pass = $("su-pass").value, pass2 = $("su-pass2").value;
  var q = $("su-q").value, a = $("su-a").value;
  if (name.length < 3) return setMsg(msg, t("e_name"));
  if (!/^[A-Za-z0-9_]{3,20}$/.test(user)) return setMsg(msg, t("e_user"));
  if (pass.length < 6) return setMsg(msg, t("e_pass6"));
  if (pass !== pass2) return setMsg(msg, t("e_passmatch"));
  if (a.trim().length < 2) return setMsg(msg, t("e_secans"));
  var users = loadUsers(), key = normUser(user);
  if (users[key]) return setMsg(msg, t("e_taken"));
  var salt = makeSalt();
  Promise.all([hashWithSalt(pass, salt), hashWithSalt(normAnswer(a), salt)]).then(function(h){
    users[key] = { name:name, username:user, salt:salt, passHash:h[0], secQ:q, secAHash:h[1], created:Date.now() };
    if (!saveUsersVerified(users)) return setMsg(msg, t("e_nostore"));
    store.set(SESSION_KEY, key);
    openDashboard(users[key]);
  });
});

/* ---------- LOGIN ---------- */
$("pane-login").addEventListener("submit", function(ev){
  ev.preventDefault();
  var msg = $("login-msg"); clearMsg(msg);
  var key = normUser($("li-user").value);
  var pass = $("li-pass").value;
  var users = loadUsers(), u = users[key];
  if (!u) return setMsg(msg, t("e_noaccount"));
  hashMatches(pass, u.salt, u.passHash).then(function(matched){
    if (!matched) return setMsg(msg, t("e_wrongpass"));
    if (matched === "legacy"){
      /* account was created with the old weak fallback hash — silently
         upgrade the stored hash to the primary SHA-256 */
      hashWithSalt(pass, u.salt).then(function(h){
        u.passHash = h; users[key] = u; saveUsersVerified(users);
      });
    }
    store.set(SESSION_KEY, key);
    openDashboard(u);
  });
});

/* ---------- FORGOT PASSWORD ---------- */
function resetForgot(){
  forgotUser = null;
  $("fg-step1").hidden = false; $("fg-step2").hidden = true; $("fg-step3").hidden = true;
  clearMsg($("forgot-msg"));
}
$("fg-next1").addEventListener("click", function(){
  var msg = $("forgot-msg"); clearMsg(msg);
  var key = normUser($("fg-user").value);
  var users = loadUsers(), u = users[key];
  if (!u) return setMsg(msg, t("e_noaccount"));
  forgotUser = key;
  $("fg-question").textContent = secqDisplay(u.secQ);
  $("fg-step1").hidden = true; $("fg-step2").hidden = false;
  setMsg(msg, t("e_found"), true);
});
$("fg-next2").addEventListener("click", function(){
  var msg = $("forgot-msg"); clearMsg(msg);
  if (!forgotUser) return;
  var users = loadUsers(), u = users[forgotUser];
  hashMatches(normAnswer($("fg-answer").value), u.salt, u.secAHash).then(function(matched){
    if (!matched) return setMsg(msg, t("e_wrongans"));
    $("fg-step2").hidden = true; $("fg-step3").hidden = false;
    setMsg(msg, t("e_correct"), true);
  });
});
$("fg-save").addEventListener("click", function(){
  var msg = $("forgot-msg"); clearMsg(msg);
  if (!forgotUser) return;
  var p1 = $("fg-newpass").value, p2 = $("fg-newpass2").value;
  if (p1.length < 6) return setMsg(msg, t("e_newpass6"));
  if (p1 !== p2) return setMsg(msg, t("e_newmatch"));
  var users = loadUsers(), u = users[forgotUser];
  var salt = makeSalt();
  Promise.all([hashWithSalt(p1, salt), hashWithSalt(normAnswer($("fg-answer").value), salt)]).then(function(h){
    u.salt = salt; u.passHash = h[0]; u.secAHash = h[1];
    users[forgotUser] = u;
    if (!saveUsersVerified(users)) return setMsg(msg, t("e_nostore"));
    store.set(SESSION_KEY, forgotUser);
    openDashboard(u);
  });
});

/* ---------- DASHBOARD ---------- */
var bubbleTimers = [];
function updateDashHead(u){
  $("dash-welcome").textContent = t("welcome").replace("{name}", u.name);
  $("dash-who").textContent = t("who").replace("{user}", u.username);
  $("dash-avatar").textContent = (u.name.trim().charAt(0) || "?").toUpperCase();
}
function openDashboard(u){
  currentUser = u;
  updateDashHead(u);
  buildCards();
  showStage("stage-dash");
}
function buildCards(){
  var grid = $("site-grid");
  if (grid.getAttribute("data-built") === "1") { startBubbles(); return; }
  grid.setAttribute("data-built","1");
  var html = "";
  for (var i=0;i<SITES.length;i++){
    var s = SITES[i];
    html += '<a class="card" style="--acc:' + s.acc + '" href="' + SITE_LINKS[s.key] + '" target="_blank" rel="noopener">'
      + '<div class="big" aria-hidden="true">' + s.emoji + '</div>'
      + '<h3>' + s.title + '</h3>'
      + '<p class="desc">' + t("desc_" + s.key) + '</p>'
      + '<div class="open-line">' + t("openLine") + '</div>'
      + '<div class="bot-zone"><div class="bot-track">'
      + '<div class="bubble" id="bubble-' + s.key + '"></div>'
      + '<div class="bot" style="animation-duration:' + (6.5 + i*0.9) + 's; animation-delay:-' + (i*1.7) + 's">'
      + '<div class="bot-body">' + s.botEmoji + '</div><div class="bot-name">' + s.bot + '</div>'
      + '</div></div></div></a>';
  }
  grid.innerHTML = html;
  startBubbles();
}
function startBubbles(){
  for (var x=0;x<bubbleTimers.length;x++) clearInterval(bubbleTimers[x]);
  bubbleTimers = [];
  SITES.forEach(function(s, idx){
    var b = $("bubble-" + s.key);
    if (!b) return;
    var li = 0;
    function cycle(){
      var lines = t("bot_" + s.key) || [];
      b.textContent = lines[li % lines.length]; li++;
      b.classList.add("show");
      setTimeout(function(){ b.classList.remove("show"); }, 3600);
    }
    setTimeout(cycle, 900 + idx*1400);
    bubbleTimers.push(setInterval(cycle, 8200));
  });
}
$("btn-logout").addEventListener("click", function(){
  store.del(SESSION_KEY);
  currentUser = null;
  $("li-pass").value = "";
  showPane("login");
  showStage("stage-auth");
});

/* ---------- first paint: language (default English), then session ---------- */
applyLanguage();
(function(){
  var key = store.get(SESSION_KEY);
  if (key){
    var users = loadUsers();
    if (users[key]) openDashboard(users[key]);
  }
})();
</script>
