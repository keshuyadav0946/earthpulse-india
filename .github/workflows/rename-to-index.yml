name: Rename disaster pages to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename disaster pages to index.html
        run: |
          set -e
          mv fire/india-fire-disaster-website.html fire/index.html
          mv flood/india-flood-disaster-website.html flood/index.html
          mv landslide/india-landslide-disaster-website.html landslide/index.html
          mv coldwave/india-cold-wave-disaster-website.html coldwave/index.html
          mv cyclone/india-cyclone-disaster-website.html cyclone/index.html
          git config user.name "keshuyadav0946"
          git config user.email "keshuyadav0946@gmail.com"
          git add -A
          git commit -m "Rename disaster pages to index.html"
          git push
