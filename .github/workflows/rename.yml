name: Rename portal to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move portal-pwa.html to index.html
        run: |
          mv portal-pwa.html index.html
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename portal-pwa.html to index.html" || echo "No changes to commit"
          git push
