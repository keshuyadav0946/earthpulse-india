name: Rename Cyclone file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded Cyclone page to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv cyclone/india-cyclone-disaster-website.html cyclone/index.html
          git add cyclone/index.html cyclone/india-cyclone-disaster-website.html
          git commit -m "Rename uploaded Cyclone page to index.html"
          git push
