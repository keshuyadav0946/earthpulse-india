name: Rename presentation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move presentation into presentation folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p presentation
          git mv EarthPulse_Presentation_Animated.html presentation/index.html
          git add -A
          git commit -m "Add presentation page"
          git push
