name: Rename Cold Wave page
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded Cold Wave page to index.html
        run: |
          mv coldwave/india-cold-wave-disaster-website.html coldwave/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coldwave
          git commit -m "Rename uploaded Cold Wave page to index.html"
          git push
