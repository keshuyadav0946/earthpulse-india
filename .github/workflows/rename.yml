name: Rename Cold Wave file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded Cold Wave page to index.html
        run: |
          mv coldwave/india-cold-wave-disaster-website.html coldwave/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coldwave
          git commit -m "Rename uploaded Cold Wave page to index.html" || echo "No changes to commit"
          git push
