name: Rename Fire file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded Fire page to index.html
        run: |
          mv fire/india-fire-disaster-website.html fire/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A fire
          git commit -m "Rename fire file to index.html" || echo "Nothing to commit"
          git push
