name: Rename Cyclone file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename cyclone-index.html to index.html
        run: |
          mv cyclone/cyclone-index.html cyclone/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A cyclone
          git commit -m "Rename uploaded Cyclone page to index.html" || echo "Nothing to commit"
          git push
