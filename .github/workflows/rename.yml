name: Rename Fire file
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded Fire page to index.html
        run: |
          mv fire/india-fire-disaster-website.html fire/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename fire file to index.html"
          git push
