name: Rename file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move PowerPoint into presentation folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv EarthPulse_Presentation.pptx presentation/EarthPulse_Presentation.pptx && git add -A && git commit -m "Add PowerPoint to presentation folder" && git push
