name: Rename Flood file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv flood/india-flood-disaster-website.html flood/index.html
          git add -A
          git commit -m "Rename uploaded Flood page to index.html" || echo "Nothing to commit"
          git push
