name: Rename Cyclone page
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded Cyclone file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv cyclone/india-cyclone-disaster-website.html cyclone/index.html
          git add -A cyclone/
          git commit -m "Rename uploaded Cyclone page to index.html"
          git push
