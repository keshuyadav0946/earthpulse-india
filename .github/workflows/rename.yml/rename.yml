name: Rename portal to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename portal-pwa.html to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv portal-pwa.html index.html
          git add -A
          git commit -m "Rename portal-pwa.html to index.html"
          git push
