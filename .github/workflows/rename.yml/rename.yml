name: Rename Fire file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Fire page to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv fire/india-fire-disaster-website.html fire/index.html
          git add -A fire/
          git commit -m "Rename Fire file to index.html"
          git push
